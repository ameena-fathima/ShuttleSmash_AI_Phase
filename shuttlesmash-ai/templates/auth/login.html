{% extends "base.html" %}
{% block title %}Login &mdash; ShuttleSmash AI{% endblock %}

{% block content %}
<div class="container">
  <div class="card auth-card p-4 p-md-5 fade-up">
    <div class="brand-mark mb-3" style="width:48px;height:48px;font-size:1.3rem;">
      <i class="bi bi-lightning-charge-fill"></i>
    </div>
    <h3 class="mb-1">Welcome back</h3>
    <p class="text-muted mb-4">Log in to view your performance history.</p>

    <form method="POST" action="{{ url_for('login') }}" novalidate>
      <div class="mb-3">
        <label for="identifier" class="form-label">Username or Email</label>
        <input
          type="text"
          class="form-control"
          id="identifier"
          name="identifier"
          value="{{ identifier or '' }}"
          required
          autofocus
        />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          required
        />
      </div>

      <button type="submit" class="btn btn-court btn-lg">
        <i class="bi bi-box-arrow-in-right me-1"></i> Log In
      </button>
    </form>

    <p class="text-center mt-4 mb-0 text-muted">
      Don't have an account?
      <a href="{{ url_for('register') }}">Sign up here</a>
    </p>
  </div>
</div>
{% endblock %}
